# 코드를 고쳐 올리면 GitHub이 알아서 설치 파일을 만들고 릴리스로 게시한다.
#
# 새 버전 내보내는 법
#   1. app.py 의 VERSION 값을 올린다  (예: "1.0.0" → "1.0.1")
#   2. 저장소에 올린다
#   3. 끝. 이미 깔려 있는 프로그램들이 알아서 갱신된다.
#
# VERSION 을 올리지 않으면 릴리스는 만들지 않고 빌드만 확인한다.

name: 윈도우 설치 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # 러너의 stdout 은 파이프라 파이썬이 윈도우 기본 코드페이지로 내보내려 한다.
    # 한글을 찍는 순간 UnicodeEncodeError 로 죽으므로 UTF-8 을 못 박는다.
    # 테스트 이름에 한글이 많은데, 이게 없으면 로그에서도 깨져 보인다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 버전 읽기
        id: version
        run: |
          $v = python version_of.py
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "app.py 에서 VERSION 을 읽지 못했습니다" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "버전 $v"

      - name: 필요한 것 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 버전을 못 박는다. 예전에 그냥 pyinstaller 라고만 적어 두었다가
          # 6.22.0 이 나오면서 새로 생긴 검사에 걸려, 갱신하고 다시 뜰 때
          # "Security validation failure" 창이 뜨는 일이 있었다.
          # 올릴 때는 올린 뒤 실제로 갱신-재시작까지 해 보고 올린다.
          pip install pyinstaller==6.22.2

      - name: 올라온 파일 확인
        run: Get-ChildItem -Force | Select-Object Name, Length

      - name: 회귀 테스트
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "회귀 테스트 실패 — 날짜/기한 추출이 깨졌습니다" }

      - name: 실행 파일 만들기
        run: pyinstaller --clean --noconfirm --log-level INFO build.spec

      - name: 설치 프로그램 만들기
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup을 찾지 못했습니다" }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 프로그램 만들기 실패" }

      - name: 만들어진 파일 보기
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: 결과물 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gongmun-windows
          path: |
            dist/*.exe
            사용설명서.txt
          retention-days: 30
          if-no-files-found: error

      # 설명글은 변경내역.md 에서 뽑는다. 갱신 전 미리보기와 갱신 뒤
      # 안내창이 같은 글을 쓰게 하려는 것이다.
      - name: 릴리스 설명글 만들기
        run: |
          python changelog.py --release ${{ steps.version.outputs.value }} release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "릴리스 설명글을 만들지 못했습니다" }
          Get-Content release-notes.md

      # 같은 버전이면 릴리스를 덮어쓰기만 하고, 새 버전이면 새로 만든다.
      - name: 릴리스로 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: 공문 정리함 ${{ steps.version.outputs.value }}
          files: dist/*.exe
          body_path: release-notes.md
