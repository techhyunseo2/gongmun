# 코드를 고쳐 올리면 GitHub이 알아서 설치 파일을 만들고 릴리스로 게시한다.
#
# 새 버전 내보내는 법
#   1. app.py 의 VERSION 값을 올린다  (예: "1.0.0" → "1.0.1")
#   2. 저장소에 올린다
#   3. 끝. 이미 깔려 있는 프로그램들이 알아서 갱신된다.
#
# VERSION 을 올리지 않으면 릴리스는 만들지 않고 빌드만 확인한다.

name: 윈도우 설치 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 버전 읽기
        id: version
        run: |
          $v = python version_of.py
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "app.py 에서 VERSION 을 읽지 못했습니다" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "버전 $v"

      - name: 필요한 것 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 올라온 파일 확인
        run: Get-ChildItem -Force | Select-Object Name, Length

      - name: 회귀 테스트
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "회귀 테스트 실패 — 날짜/기한 추출이 깨졌습니다" }

      - name: 실행 파일 만들기
        run: pyinstaller --clean --noconfirm --log-level INFO build.spec

      - name: 설치 프로그램 만들기
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup을 찾지 못했습니다" }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "설치 프로그램 만들기 실패" }

      - name: 만들어진 파일 보기
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: 결과물 보관
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gongmun-windows
          path: |
            dist/*.exe
            사용설명서.txt
          retention-days: 30
          if-no-files-found: error

      # 같은 버전이면 릴리스를 덮어쓰기만 하고, 새 버전이면 새로 만든다.
      - name: 릴리스로 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: 공문 정리함 ${{ steps.version.outputs.value }}
          files: dist/*.exe
          body: |
            처음 쓰시는 분은 `공문정리함-설치.exe` 를 받으세요.

            이미 쓰고 계신 분은 아무것도 하지 않으셔도 됩니다.
            프로그램이 하루에 한 번 확인해서 알아서 갱신합니다.
