<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공문 정리함</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root{
    --paper:#DDE1DC;
    --card:#FBFBF8;
    --ink:#16201B;
    --ink-soft:#5C685F;
    --rule:#C3CAC3;
    --seal:#A6301F;
    --seal-deep:#761E12;
    --moss:#3C5A46;
    --slate:#3A5560;
    --ochre:#8A6A1F;
    --shadow:0 18px 40px -22px rgba(20,32,26,.55);
    --cat-submit:#A6301F;
    --cat-event:#3A5560;
    --cat-apply:#8A6A1F;
    --cat-distribute:#3C5A46;
    --cat-notice:#7B8480;
    --cat-other:#A6ADA7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--slate);outline-offset:2px;border-radius:2px}

  /* ---------------------------------------------------------- 머리말 */
  header{
    padding:22px 32px 16px; border-bottom:1px solid var(--rule);
    display:flex; flex-wrap:wrap; gap:18px; align-items:baseline;
  }
  h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em}
  .folder{
    font-size:13px; color:var(--ink-soft); border-bottom:1px dashed var(--rule);
    padding-bottom:1px; max-width:46ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .folder:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .tools{margin-left:auto; display:flex; gap:8px; align-items:center}
  .tool{
    font-size:13px; padding:6px 12px; border:1px solid var(--rule);
    background:var(--card); border-radius:3px;
  }
  .tool:hover{border-color:var(--ink);}
  .tool[data-busy="1"]{opacity:.5;pointer-events:none}

  .headline{
    padding:14px 32px; font-size:14px; color:var(--ink-soft);
    display:flex; gap:20px; flex-wrap:wrap; align-items:center;
  }
  .headline b{color:var(--ink); font-weight:600}
  .headline .alarm{color:var(--seal); font-weight:600}

  /* ------------------------------------------------------------ 본체 */
  main{display:grid; grid-template-columns:196px 1fr; gap:0; align-items:start}
  nav{padding:4px 12px 40px 32px; position:sticky; top:0}
  .filter{
    display:flex; width:100%; align-items:center; gap:8px; padding:7px 10px 7px 8px;
    border-radius:3px; font-size:14px; text-align:left;
  }
  .filter:hover{background:rgba(255,255,255,.55)}
  .filter[aria-pressed="true"]{background:var(--card); box-shadow:inset 2px 0 0 var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .filter .n{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13px}
  nav hr{border:none;border-top:1px solid var(--rule);margin:14px 4px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);padding:4px 8px}
  #search{
    width:100%; margin:10px 0 2px; padding:7px 10px; border:1px solid var(--rule);
    background:var(--card); border-radius:3px; font-size:13px;
  }

  section.list{padding:4px 32px 80px 20px; min-width:0}

  /* ----------------------------------------------------------- 눈금 */
  .band{display:flex; align-items:center; gap:12px; margin:22px 0 8px}
  .band:first-child{margin-top:0}
  .band-name{font-size:13px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
  .band-line{flex:1; height:1px; background:var(--rule)}
  .band.past .band-name{color:var(--seal-deep)}
  .band.past .band-line{background:var(--seal);opacity:.4}

  /* ------------------------------------------------------------ 행 */
  .row{
    display:grid; grid-template-columns:20px 58px 1fr auto; gap:12px; align-items:baseline;
    width:100%; text-align:left; background:var(--card); border:1px solid var(--rule);
    border-left:3px solid var(--cat-other); border-radius:3px;
    padding:10px 14px; margin-bottom:5px;
  }
  .row:hover{border-color:var(--ink-soft)}
  .row[aria-selected="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
  .row.done{opacity:.45}
  .row.done .name{text-decoration:line-through}

  .dday{
    font-variant-numeric:tabular-nums; font-weight:700; font-size:16px;
    letter-spacing:-.03em; color:var(--slate);
  }
  .dday.warn{color:var(--seal)}
  .dday.none{font-weight:500; font-size:13px; color:var(--ink-soft)}
  .name{font-weight:500; letter-spacing:-.01em; overflow-wrap:anywhere}
  .meta{display:block; font-size:12.5px; color:var(--ink-soft); margin-top:2px}
  .kind{font-size:12px; color:var(--ink-soft); white-space:nowrap}
  .flag{font-size:11px; color:var(--ochre); margin-left:6px}

  /* 고르기 */
  .pick{
    width:15px; height:15px; border:1px solid var(--rule); border-radius:2px;
    background:var(--paper); align-self:center; position:relative; flex:none;
  }
  .row:hover .pick{border-color:var(--ink-soft)}
  .pick[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
  .pick[aria-checked="true"]::after{
    content:"✓"; position:absolute; inset:0; color:var(--card);
    font-size:11px; line-height:15px; text-align:center;
  }
  .bandpick{
    font-size:11.5px; color:var(--ink-soft); border-bottom:1px dashed var(--rule);
    white-space:nowrap; padding-bottom:1px;
  }
  .bandpick:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .picked{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px;
    background:var(--ink); color:var(--card); border-radius:3px;
    padding:9px 14px; margin-bottom:10px; font-size:13.5px;
  }
  .picked b{font-weight:600}
  .picked .act{
    margin-left:auto; display:flex; gap:6px;
  }
  .picked .act button{
    border:1px solid rgba(251,251,248,.35); border-radius:3px; padding:5px 11px;
    color:var(--card); font-size:13px;
  }
  .picked .act button:hover{background:rgba(251,251,248,.14);border-color:var(--card)}
  .picked .act .go{background:var(--card);color:var(--ink);border-color:var(--card)}
  .picked .act .go:hover{background:#fff}
  .sweep{
    font-size:13px; color:var(--seal); border-bottom:1px dashed var(--rule);
    padding-bottom:1px; font-weight:500;
  }
  .sweep:hover{border-bottom-color:var(--seal)}
  .sweep.quiet{color:var(--ink-soft);font-weight:400}
  .sweep.quiet:hover{color:var(--ink);border-bottom-color:var(--ink)}

  .empty{
    border:1px dashed var(--rule); border-radius:3px; padding:34px 24px;
    text-align:center; color:var(--ink-soft); font-size:14px; background:rgba(251,251,248,.5);
  }
  .empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px;font-size:15px}

  /* ---------------------------------------------------------- 상세 */
  .scrim{position:fixed;inset:0;background:rgba(22,32,27,.28);opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{
    position:fixed; top:0; right:0; height:100%; width:min(480px,92vw);
    background:var(--card); border-left:1px solid var(--rule); box-shadow:var(--shadow);
    transform:translateX(100%); transition:transform .22s ease; overflow-y:auto; padding:26px 28px 60px;
  }
  aside.open{transform:none}
  @media (prefers-reduced-motion:reduce){aside,.scrim{transition:none}}
  aside h2{margin:0 34px 4px 0; font-size:17px; font-weight:700; letter-spacing:-.02em; line-height:1.4}
  .close{position:absolute;top:20px;right:22px;font-size:20px;color:var(--ink-soft);line-height:1}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px}
  .field{margin:18px 0}
  .field > label{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .field > label > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--rule);border-radius:3px;padding:5px 9px;font-size:12.5px;background:var(--paper)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .field input[type=date],.field textarea{
    width:100%;border:1px solid var(--rule);border-radius:3px;padding:8px 10px;background:var(--paper);
  }
  .field textarea{min-height:64px;resize:vertical}
  .dates{display:flex;flex-wrap:wrap;gap:6px}
  .datechip{
    font-size:12.5px; border:1px solid var(--rule); border-radius:3px; padding:5px 9px;
    font-variant-numeric:tabular-nums; background:var(--paper); cursor:pointer;
  }
  .datechip:hover{border-color:var(--ink)}
  .datechip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .hint{font-size:11.5px;color:var(--ink-soft);font-weight:400;flex:none}
  .quote{
    border-left:2px solid var(--seal); padding:6px 0 6px 12px; font-size:13px;
    color:var(--ink-soft); margin-top:8px;
  }
  .body{
    white-space:pre-wrap; font-size:13px; line-height:1.7; color:var(--ink-soft);
    max-height:280px; overflow:auto; border:1px solid var(--rule); border-radius:3px;
    padding:12px 14px; background:var(--paper);
  }
  /* 서식 보기 — hwpx 리더가 만든 구조 */
  .body.formatted{white-space:normal; color:var(--ink); background:var(--card); padding:16px 18px; max-height:400px}
  .body .hx-p{margin:0 0 .38em; line-height:1.65}
  .body .hx-p:last-child{margin-bottom:0}
  .body .hx-center{text-align:center}
  .body .hx-right{text-align:right}
  .body .hx-tab{display:inline-block;width:1.6em}
  .body .hx-obj{color:var(--ink-soft);font-size:12px}
  .body .hx-table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:12.5px}
  .body .hx-table th,.body .hx-table td{
    border:1px solid var(--rule); padding:5px 8px; vertical-align:top; text-align:left;
  }
  .body .hx-table th{background:var(--paper);font-weight:600;color:var(--ink)}
  .files{display:flex;flex-direction:column;gap:4px}
  .filerow{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    border:1px solid var(--rule); border-radius:3px; padding:7px 10px;
    background:var(--paper); font-size:13px; cursor:pointer;
  }
  .filerow:hover{border-color:var(--ink)}
  .filerow[aria-pressed="true"]{background:var(--card);box-shadow:inset 2px 0 0 var(--ink)}
  .filerow .tag{
    font-size:11px; color:var(--card); background:var(--ink-soft);
    border-radius:2px; padding:1px 5px; flex:none;
  }
  .filerow .tag.body{background:var(--slate)}
  .filerow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filerow .bad{color:var(--seal);font-size:11.5px;margin-left:auto;flex:none}
  .body .hx-sheet{
    font-weight:600; font-size:12.5px; color:var(--ink); margin:14px 0 4px;
    padding-bottom:3px; border-bottom:1px solid var(--rule);
  }
  .body .hx-sheet:first-child{margin-top:0}
  .clip{font-size:12px;color:var(--ink-soft);margin-left:6px}
  .viewswitch{flex:none;font-size:12px;color:var(--ink-soft);border-bottom:1px dashed var(--rule)}
  .viewswitch:hover{color:var(--ink);border-bottom-color:var(--ink)}
  .actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .primary{background:var(--ink);color:var(--card);border-radius:3px;padding:9px 16px;font-size:14px}
  .primary:hover{background:var(--moss)}
  .ghost{border:1px solid var(--rule);border-radius:3px;padding:9px 16px;font-size:14px}
  .ghost:hover{border-color:var(--ink)}
  .warnbox{border:1px solid var(--seal);border-radius:3px;padding:10px 12px;font-size:13px;color:var(--seal-deep)}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,14px);
    background:var(--ink); color:var(--card); padding:9px 18px; border-radius:3px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .16s,transform .16s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:820px){
    header,.headline{padding-left:20px;padding-right:20px}
    main{grid-template-columns:1fr}
    nav{position:static;padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:4px}
    nav hr,#search{display:none}
    section.list{padding:8px 20px 80px}
    .row{grid-template-columns:20px 52px 1fr;gap:10px}
    .kind{display:none}
  }
</style>
</head>
<body>

<header>
  <h1>공문 정리함</h1>
  <button class="folder" id="folder" title="폴더 열기">폴더를 읽는 중</button>
  <div class="tools">
    <button class="tool" id="rescan">다시 훑기</button>
    <button class="tool" id="deep">전체 재분석</button>
    <button class="tool" id="tidy">폴더 정리</button>
    <button class="tool" id="archive">완료된 업무 정리</button>
    <button class="tool" id="ics">일정 내보내기</button>
    <button class="tool" id="setfolder">폴더 바꾸기</button>
  </div>
</header>

<p class="headline" id="headline"></p>

<main>
  <nav id="nav"></nav>
  <section class="list" id="list"></section>
</main>

<div class="scrim" id="scrim"></div>
<aside id="panel" aria-hidden="true"></aside>
<div id="toast"></div>

<script>
const CAT_COLOR = {
  submit:"var(--cat-submit)", event:"var(--cat-event)", apply:"var(--cat-apply)",
  distribute:"var(--cat-distribute)", notice:"var(--cat-notice)", other:"var(--cat-other)"
};
const BANDS = [
  {key:"past",  name:"기한 지남",   test:d => d.days_left !== null && d.days_left < 0,  past:true},
  {key:"now",   name:"오늘·내일",   test:d => d.days_left !== null && d.days_left <= 1},
  {key:"week",  name:"이번 주",     test:d => d.days_left !== null && d.days_left <= 7},
  {key:"month", name:"한 달 안",    test:d => d.days_left !== null && d.days_left <= 31},
  {key:"later", name:"그 이후",     test:d => d.days_left !== null},
  {key:"dated", name:"날짜만 있음", test:d => !!d.event_date},
  {key:"open",  name:"기한 없음",   test:() => true}
];

let state = null;
let filter = "all";
let showDone = false;
let keyword = "";
let selected = null;

const $ = id => document.getElementById(id);

/* ------------------------------------------------------------- 통신 */
const POLL_MS = 4000;
let lastRev = -1;          // 지금 화면에 그려져 있는 내용의 번호

async function call(url, body){
  const res = await fetch(url, body ? {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  } : undefined);
  const data = await res.json();
  // 응답이 상태를 담고 있으면 번호를 따라간다. 뒤늦게 도착한 옛 응답이
  // 번호를 되돌리지 않도록 올라가기만 한다.
  if (data && typeof data.rev === "number" && data.rev > lastRev) lastRev = data.rev;
  return data;
}

/* 위젯이나 다른 탭에서 고친 것을 따라잡는다.
   번호만 물어보고 달라졌을 때만 전체를 받아 온다. */
function busy(){
  if (document.hidden) return true;                 // 안 보고 있는 탭
  const el = document.activeElement;
  if (!el) return false;
  // 검색창·메모·기한칸에 커서가 있으면 그대로 둔다. 다시 그리면 그 칸이
  // 새로 만들어져 입력하던 내용과 커서가 날아간다.
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA";
}

async function poll(){
  if (!state || busy()) return;
  let rev;
  try { rev = (await (await fetch("/api/rev")).json()).rev; }
  catch(e){ return; }                               // 서버가 잠깐 없다. 다음 차례에
  if (typeof rev !== "number") return;
  if (rev < lastRev) lastRev = -1;                  // 서버가 다시 떠서 번호가 되감겼다
  if (rev === lastRev) return;

  const seen = lastRev;
  let fresh;
  try { fresh = await call("/api/state"); }
  catch(e){ return; }
  if (typeof fresh.rev !== "number" || fresh.rev < seen) return;   // 지나간 응답은 버린다
  state = fresh;
  render();
}
function toast(text){
  const el = $("toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ------------------------------------------------------------- 그리기 */
function visible(){
  return state.docs.filter(d => {
    if (!showDone && d.done) return false;
    if (filter !== "all" && d.category !== filter) return false;
    if (keyword){
      const hay = (d.title + d.filename + (d.sender||"") + (d.memo||"")).toLowerCase();
      if (!hay.includes(keyword)) return false;
    }
    return true;
  });
}

function render(){
  const cats = state.categories, order = state.order;

  /* 머리말 */
  const todo = state.docs.filter(d => !d.done).length;
  const [, mm, dd] = state.today.split("-");
  const bits = [`오늘 ${+mm}월 ${+dd}일`, `처리할 것 <b>${todo}건</b>`];
  if (state.urgent) bits.push(`<span class="alarm">사흘 안 마감 ${state.urgent}건</span>`);
  const overdue = state.docs.filter(d => !d.done && d.days_left !== null && d.days_left < 0);
  if (overdue.length) bits.push(`<button class="sweep" id="sweep">기한 지난 ${overdue.length}건 모두 고르기</button>`);

  const onScreen = visible();
  const allPicked = onScreen.length > 0 && onScreen.every(d => chosen.has(d.id));
  if (onScreen.length) bits.push(
    `<button class="sweep quiet" id="pickall">${allPicked ? "모두 해제" : "모두 고르기"}</button>`);

  $("headline").innerHTML = bits.join(" · ");

  const sweep = $("sweep");
  if (sweep) sweep.onclick = () => {
    overdue.forEach(d => chosen.add(d.id));
    render();
  };
  const pickall = $("pickall");
  if (pickall) pickall.onclick = () => {
    onScreen.forEach(d => allPicked ? chosen.delete(d.id) : chosen.add(d.id));
    render();
  };
  $("folder").textContent = state.folder;

  /* 왼쪽 */
  const nav = $("nav");
  const total = state.docs.filter(d => !d.done).length;
  let html = `<button class="filter" data-cat="all" aria-pressed="${filter==="all"}">
      <span class="dot" style="background:var(--ink)"></span>전체<span class="n">${total}</span></button>`;
  for (const key of order){
    html += `<button class="filter" data-cat="${key}" aria-pressed="${filter===key}">
      <span class="dot" style="background:${CAT_COLOR[key]}"></span>${cats[key]}
      <span class="n">${state.counts[key]||0}</span></button>`;
  }
  html += `<hr><label class="check"><input type="checkbox" id="donebox" ${showDone?"checked":""}> 처리한 것도 보기</label>
           <input id="search" type="search" placeholder="제목·기관 검색" value="${keyword.replace(/"/g,"&quot;")}">`;
  nav.innerHTML = html;

  nav.querySelectorAll(".filter").forEach(btn =>
    btn.onclick = () => { filter = btn.dataset.cat; render(); });
  $("donebox").onchange = e => { showDone = e.target.checked; render(); };
  const search = $("search");
  search.oninput = e => { keyword = e.target.value.trim().toLowerCase(); renderList(); };

  renderList();
}

function renderList(){
  const alive = new Set(state.docs.map(d => d.id));
  [...chosen].forEach(id => { if (!alive.has(id)) chosen.delete(id); });
  const docs = visible();
  const list = $("list");
  if (!docs.length){
    list.innerHTML = state.docs.length
      ? `<div class="empty"><b>여기에 해당하는 공문이 없습니다</b>다른 유형을 눌러 보거나 검색어를 지워 보세요.</div>`
      : `<div class="empty"><b>아직 읽은 공문이 없습니다</b>공문 파일을 폴더에 넣고 다시 훑기를 누르면 여기에 정리됩니다.</div>`;
    return;
  }

  const buckets = new Map(BANDS.map(b => [b.key, []]));
  const done = [];
  for (const doc of docs){
    if (doc.done){ done.push(doc); continue; }
    for (const band of BANDS){
      if (band.test(doc)){ buckets.get(band.key).push(doc); break; }
    }
  }

  let html = _pickedBar();
  for (const band of BANDS){
    const group = buckets.get(band.key);
    if (!group.length) continue;
    const allPicked = group.every(d => chosen.has(d.id));
    html += `<div class="band ${band.past?"past":""}">
      <span class="band-name">${band.name}</span><span class="band-line"></span>
      <button class="bandpick" data-band="${band.key}">${allPicked ? "고르기 해제" : "이 구간 모두"}</button></div>`;
    html += group.map(row).join("");
  }
  if (done.length){
    const allDone = done.every(d => chosen.has(d.id));
    html += `<div class="band"><span class="band-name">처리함</span><span class="band-line"></span>
      <button class="bandpick" data-band="done">${allDone ? "고르기 해제" : "이 구간 모두"}</button></div>`;
    html += done.map(row).join("");
  }
  list.innerHTML = html;
  list.querySelectorAll(".row").forEach(el => el.onclick = () => openPanel(el.dataset.id));
  list.querySelectorAll(".pick").forEach(el => el.onclick = event => {
    event.stopPropagation();
    const id = el.parentElement.dataset.id;
    chosen.has(id) ? chosen.delete(id) : chosen.add(id);
    render();
  });
  list.querySelectorAll(".bandpick").forEach(el => el.onclick = () => {
    const band = BANDS.find(b => b.key === el.dataset.band);
    const members = el.dataset.band === "done" ? done : buckets.get(band.key);
    const allPicked = members.every(d => chosen.has(d.id));
    members.forEach(d => allPicked ? chosen.delete(d.id) : chosen.add(d.id));
    render();
  });
  _bindPickedBar();
}

function _pickedBar(){
  const picked = state.docs.filter(d => chosen.has(d.id));
  if (!picked.length) return "";
  const allDone = picked.every(d => d.done);
  const onScreen = visible();
  const allPicked = onScreen.length > 0 && onScreen.every(d => chosen.has(d.id));
  const more = allPicked ? "" : `<button id="bulkall">모두 고르기</button>`;
  return `<div class="picked">
    <b>${picked.length}건</b> 골랐습니다
    <span class="act">
      <button class="go" id="bulkdone">${allDone ? "처리 취소" : "처리 완료"}</button>
      ${more}
      <button id="bulkclear">해제</button>
    </span></div>`;
}

function _bindPickedBar(){
  const go = $("bulkdone");
  if (!go) return;
  go.onclick = async () => {
    const picked = state.docs.filter(d => chosen.has(d.id));
    const done = !picked.every(d => d.done);
    const members = picked.flatMap(d => (d.members || [{id:d.id}]).map(m => m.id));
    go.textContent = "처리 중";
    state = await call("/api/done", {members, done});
    chosen.clear();
    toast(done ? `${picked.length}건을 처리함으로 옮겼습니다.`
               : `${picked.length}건을 다시 처리할 것으로 옮겼습니다.`);
    render();
  };
  $("bulkclear").onclick = () => { chosen.clear(); render(); };
  const all = $("bulkall");
  if (all) all.onclick = () => { visible().forEach(d => chosen.add(d.id)); render(); };
}

function row(doc){
  const cats = state.categories;
  let badge, cls = "dday";
  if (doc.days_left === null){
    badge = doc.event_date ? doc.event_date.slice(5).replace("-",".") : "—";
    cls += " none";
  } else if (doc.days_left < 0){ badge = `D+${-doc.days_left}`; cls += " warn"; }
  else if (doc.days_left === 0){ badge = "오늘"; cls += " warn"; }
  else { badge = `D-${doc.days_left}`; if (doc.days_left <= 3) cls += " warn"; }

  const meta = [doc.sender, doc.receipt_number || _shortFile(doc)]
    .filter(Boolean).join(" · ");
  const low = doc.confidence === "낮음" && !doc.edited ? `<span class="flag">확인 필요</span>` : "";
  const box = doc.archived ? `<span class="clip">${esc(doc.archived)} 보관</span>` : "";
  const clip = doc.attachments ? `<span class="clip">첨부 ${doc.attachments}</span>` : "";
  return `<button class="row ${doc.done?"done":""}" data-id="${doc.id}"
      style="border-left-color:${CAT_COLOR[doc.category]}" aria-selected="${selected===doc.id}">
    <span class="pick" role="checkbox" aria-checked="${chosen.has(doc.id)}"
      title="고르기"></span>
    <span class="${cls}">${badge}</span>
    <span><span class="name">${esc(doc.title || doc.filename)}</span>${low}${clip}${box}
      <span class="meta">${esc(meta)}</span></span>
    <span class="kind">${cats[doc.category]}</span>
  </button>`;
}

function dateLabel(iso){
  const [y, m, d] = iso.split("-").map(Number);
  const weekday = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
  const thisYear = Number(state.today.slice(0, 4));
  const head = y === thisYear ? "" : `${y}. `;
  return `${head}${m}. ${d}.(${weekday})`;
}

function _shortFile(doc){
  const stem = doc.filename.replace(/\.[^.]+$/, "");
  if (stem.replace(/\s/g,"") === (doc.title||"").replace(/\s/g,"")) return "";
  return stem.length > 40 ? stem.slice(0, 39) + "…" + "." + doc.filename.split(".").pop()
                          : doc.filename;
}

const esc = s => (s||"").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

/* ------------------------------------------------------------- 상세 */
let chosen = new Set();
let plainView = false;
let viewingFile = null;    // 묶음 안에서 지금 보고 있는 파일

function _filelist(members, doc){
  if (members.length < 2) return "";
  const rows = members.map(m => {
    const tag = m.role === "본문" ? `<span class="tag body">본문</span>`
              : m.role ? `<span class="tag">${esc(m.role)}</span>` : "";
    const bad = m.error ? `<span class="bad">못 읽음</span>` : "";
    return `<button class="filerow" data-file="${m.id}" aria-pressed="${viewingFile===m.id}">
      ${tag}<span class="nm">${esc(m.filename)}</span>${bad}</button>`;
  }).join("");
  return `<div class="field"><label><span>이 공문에 딸린 문서 ${members.length}개</span><span class="hint">눌러서 미리보기</span></label>
    <div class="files">${rows}</div></div>`;
}

function _preview(doc, label){
  if (!doc.body && !doc.body_html) return "";
  const hasForm = !!doc.body_html;
  const formatted = hasForm && !plainView;
  const inner = formatted ? doc.body_html : esc((doc.body||"").slice(0,4000));
  const toggle = hasForm
    ? `<button class="viewswitch" id="viewswitch">${formatted ? "글자만 보기" : "서식 보기"}</button>` : "";
  const short = label && label.length > 34 ? label.slice(0, 33) + "…" : label;
  const heading = short ? `미리보기 — ${esc(short)}` : "본문 미리보기";
  return `<div class="field"><label><span>${heading}</span>${toggle}</label>
    <div class="body ${formatted ? "formatted" : ""}">${inner}</div></div>`;
}

async function openPanel(id, fileId){
  selected = id;
  const doc = await call("/api/doc?id=" + encodeURIComponent(id));
  const group = state.docs.find(d => d.id === id) || doc;
  const members = group.members || [{id:doc.id, filename:doc.filename, role:"", error:doc.error}];
  viewingFile = fileId || (members.find(m => m.id === id) ? id : members[0].id);
  const shown = viewingFile === doc.id ? doc
              : await call("/api/doc?id=" + encodeURIComponent(viewingFile));
  const cats = state.categories;

  const chips = state.order.map(key =>
    `<button class="chip" data-cat="${key}" aria-pressed="${doc.category===key}">${cats[key]}</button>`).join("");
  const chips2 = (doc.all_dates||[]).map(d =>
    `<button class="datechip" data-date="${d}" aria-pressed="${doc.deadline===d}"
       title="누르면 기한으로 정해집니다">${dateLabel(d)}</button>`).join("");
  const dates = chips2 || "<span class='meta'>본문에서 날짜를 찾지 못했습니다.</span>";

  $("panel").innerHTML = `
    <button class="close" id="closebtn" aria-label="닫기">×</button>
    <h2>${esc(doc.title || doc.filename)}</h2>
    <p class="sub">${esc([doc.sender, doc.doc_number, doc.receipt_number,
       members.length > 1 ? "" : _shortFile(doc)].filter(Boolean).join(" · "))}</p>
    ${doc.error ? `<div class="warnbox">이 파일은 읽지 못했습니다. ${esc(doc.error)}</div>` : ""}
    <div class="field"><label><span>업무 유형</span></label><div class="chips" id="chips">${chips}</div></div>
    <div class="field"><label><span>기한</span></label>
      <input type="date" id="deadline" value="${doc.deadline||""}">
      ${doc.deadline_context ? `<p class="quote">${esc(doc.deadline_context)}</p>` : ""}
    </div>
    <div class="field"><label><span>본문에 나온 날짜</span>${doc.all_dates && doc.all_dates.length
      ? '<span class="hint">누르면 기한이 됩니다</span>' : ''}</label>
      <div class="dates">${dates}</div></div>
    <div class="field"><label><span>메모</span></label><textarea id="memo" placeholder="처리 방법이나 담당자를 적어 두세요">${esc(doc.memo)}</textarea></div>
    ${_filelist(members, doc)}
    ${_preview(shown, members.length > 1 ? shown.filename : "")}
    <div class="actions">
      <button class="primary" id="openfile">${members.length > 1 ? "보고 있는 파일 열기" : "원본 파일 열기"}</button>
      <button class="ghost" id="toggledone">${group.done ? "처리 취소" : "처리 완료"}</button>
    </div>`;

  $("panel").classList.add("open");
  $("panel").setAttribute("aria-hidden","false");
  $("scrim").classList.add("open");

  $("closebtn").onclick = closePanel;
  $("chips").querySelectorAll(".chip").forEach(chip => chip.onclick = async () => {
    state = await call("/api/category", {id, category:chip.dataset.cat});
    toast("유형을 바꿨습니다."); render(); openPanel(id);
  });
  $("deadline").onchange = async e => {
    state = await call("/api/deadline", {id, deadline:e.target.value});
    toast("기한을 바꿨습니다."); render();
  };
  $("memo").onblur = async e => {
    state = await call("/api/memo", {id, memo:e.target.value}); render();
  };
  $("panel").querySelectorAll(".filerow").forEach(row => row.onclick = () => {
    openPanel(id, row.dataset.file);
  });
  $("panel").querySelectorAll(".datechip").forEach(chip => chip.onclick = async () => {
    const picked = chip.dataset.date;
    const value = picked === doc.deadline ? "" : picked;
    state = await call("/api/deadline", {id, deadline: value});
    toast(value ? `기한을 ${dateLabel(value)}로 정했습니다.` : "기한을 지웠습니다.");
    render(); openPanel(id);
  });

  const switcher = $("viewswitch");
  if (switcher) switcher.onclick = () => { plainView = !plainView; openPanel(id); };
  $("openfile").onclick = async () => {
    const res = await call("/api/open?id=" + encodeURIComponent(viewingFile || id));
    if (res.error) toast(res.error);
  };
  $("toggledone").onclick = async () => {
    state = await call("/api/done", {id, done:!group.done, members:members.map(m => m.id)});
    toast(group.done ? "다시 처리할 것으로 옮겼습니다." : "처리함으로 옮겼습니다.");
    render(); closePanel();
  };
  renderList();
}

function closePanel(){
  selected = null;
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden","true");
  $("scrim").classList.remove("open");
  renderList();
}

/* ------------------------------------------------------------- 도구 */
async function scan(force){
  const btn = force ? $("deep") : $("rescan");
  btn.dataset.busy = "1";
  const before = btn.textContent;
  btn.textContent = "읽는 중";
  state = await call("/api/scan" + (force ? "?force=1" : ""));
  btn.dataset.busy = "0"; btn.textContent = before;
  const r = state.report || {};
  toast(`새로 ${r.added||0}건 · 그대로 ${r.skipped||0}건${r.failed ? ` · 못 읽음 ${r.failed}건` : ""}`);
  render();
}

$("rescan").onclick = () => scan(false);
$("deep").onclick = () => scan(true);
$("scrim").onclick = closePanel;
$("ics").onclick = () => { location.href = "/api/calendar.ics"; toast("내려받은 파일을 캘린더에서 가져오세요."); };
$("tidy").onclick = async () => {
  const preview = await call("/api/organize?preview=1");
  const plan = preview.organized || {};
  if (!plan.moved){
    toast("정리할 파일이 없습니다.");
    return;
  }
  const names = (plan.folders || []).slice(0, 6).map(n => "  · " + n).join("\n");
  const more = (plan.folders || []).length > 6 ? `\n  … 그 밖에 ${plan.folders.length - 6}개` : "";
  if (!confirm(`파일 ${plan.moved}개를 공문별 폴더로 옮깁니다.\n\n${names}${more}\n\n파일을 지우지는 않습니다. 계속할까요?`)) return;
  $("tidy").dataset.busy = "1";
  state = await call("/api/organize");
  $("tidy").dataset.busy = "0";
  const done = state.organized || {};
  toast(`${done.moved}개를 ${(done.folders||[]).length}개 폴더로 옮겼습니다.`);
  render();
};
$("archive").onclick = async () => {
  const preview = await call("/api/archive?preview=1");
  const plan = preview.archived_report || {};
  if (!plan.moved){
    toast(plan.no_date ? `날짜를 알 수 없는 ${plan.no_date}건은 옮길 수 없습니다.`
                       : "정리할 완료 공문이 없습니다.");
    return;
  }
  const lines = (plan.plans || []).slice(0, 8).map(([m, n]) => `  ${m}  ${n}`).join("\n");
  const more = (plan.plans || []).length > 8 ? `\n  … 그 밖에 ${plan.plans.length - 8}건` : "";
  const note = plan.no_date ? `\n\n날짜를 알 수 없는 ${plan.no_date}건은 그대로 둡니다.` : "";
  if (!confirm(`처리 완료한 공문 ${plan.plans.length}건을 마감 월 폴더로 옮깁니다.\n\n`
    + `옮겨 갈 곳: ${plan.base}\n\n${lines}${more}${note}\n\n계속할까요?`)) return;
  $("archive").dataset.busy = "1";
  state = await call("/api/archive");
  $("archive").dataset.busy = "0";
  const done = state.archived_report || {};
  toast(`${done.moved}개 파일을 월별 폴더로 옮겼습니다.`);
  render();
};
$("folder").onclick = () => call("/api/open-folder");
$("setfolder").onclick = async () => {
  const next = prompt("공문을 모아 두는 폴더 경로를 적어 주세요", state.folder);
  if (!next) return;
  const res = await call("/api/folder", {folder:next});
  if (res.error) return toast(res.error);
  state = res; toast("폴더를 바꿨습니다."); render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

(async () => {
  state = await call("/api/state");
  render();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
